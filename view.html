<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>View Tasks</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background-color: #f2f2f2;
    }

    h1 {
      color: #333;
    }

    nav {
      margin-bottom: 30px;
    }

    nav a {
      margin-right: 15px;
      text-decoration: none;
      color: #0066cc;
      font-size: 16px;
    }

    nav a:hover {
      text-decoration: underline;
    }

    table {
      width: 100%;
      max-width: 650px;
      border-collapse: collapse;
      background-color: white;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 10px;
      text-align: left;
    }

    th {
      background-color: #0066cc;
      color: white;
    }

    tr:nth-child(even) {
      background-color: #f9f9f9;
    }

    .delete-btn {
      background-color: #cc0000;
      color: white;
      border: none;
      padding: 5px 10px;
      cursor: pointer;
      border-radius: 4px;
      font-size: 13px;
    }

    .delete-btn:hover {
      background-color: #aa0000;
    }

    #message {
      color: red;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <h1>View Tasks</h1>

  <nav>
    <a href="index.html">Home</a>
    <a href="view.html">View Tasks</a>
    <a href="add.html">Add Task</a>
    <a href="edit.html">Edit Task</a>
  </nav>

  <p id="message"></p>

  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Title</th>
        <th>Status</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="taskTableBody">
      <tr><td colspan="4">Loading...</td></tr>
    </tbody>
  </table>

  <script>
    function loadTasks() {
      fetch('https://my-express-app-rj65.onrender.com/api/v1/tasks')
        .then(function(response) {
          return response.json();
        })
        .then(function(tasks) {
          var tbody = document.getElementById('taskTableBody');
          tbody.innerHTML = '';

          if (tasks.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4">No tasks found.</td></tr>';
            return;
          }

          for (var i = 0; i < tasks.length; i++) {
            var row = '<tr>';
            row += '<td>' + tasks[i].id + '</td>';
            row += '<td>' + tasks[i].title + '</td>';
            row += '<td>' + tasks[i].status + '</td>';
            row += '<td><button class="delete-btn" onclick="deleteTask(' + tasks[i].id + ')">Delete</button></td>';
            row += '</tr>';
            tbody.innerHTML += row;
          }
        })
        .catch(function(error) {
          document.getElementById('message').textContent = 'Error loading tasks.';
        });
    }

    function deleteTask(id) {
      if (!confirm('Are you sure you want to delete this task?')) {
        return;
      }

      fetch('https://my-express-app-rj65.onrender.com/api/v1/tasks/' + id, {
        method: 'DELETE'
      })
      .then(function(response) {
        return response.json();
      })
      .then(function(data) {
        loadTasks();
      })
      .catch(function(error) {
        document.getElementById('message').textContent = 'Error deleting task.';
      });
    }

    loadTasks();
  </script>

</body>
</html>

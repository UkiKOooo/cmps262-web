<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>View Tasks</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background-color: #f2f2f2;
    }

    h1 {
      color: #333;
    }

    nav {
      margin-bottom: 30px;
    }

    nav a {
      margin-right: 15px;
      text-decoration: none;
      color: #0066cc;
      font-size: 16px;
    }

    nav a:hover {
      text-decoration: underline;
    }

    table {
      width: 100%;
      max-width: 600px;
      border-collapse: collapse;
      background-color: white;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 10px;
      text-align: left;
    }

    th {
      background-color: #0066cc;
      color: white;
    }

    tr:nth-child(even) {
      background-color: #f9f9f9;
    }

    #message {
      color: red;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <h1>View Tasks</h1>

  <nav>
    <a href="index.html">Home</a>
    <a href="view.html">View Tasks</a>
    <a href="add.html">Add Task</a>
    <a href="edit.html">Edit Task</a>
  </nav>

  <p id="message"></p>

  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Title</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody id="taskTableBody">
      <tr><td colspan="3">Loading...</td></tr>
    </tbody>
  </table>

  <script>
    fetch('https://my-express-app-rj65.onrender.com/api/v1/tasks')
      .then(function(response) {
        return response.json();
      })
      .then(function(tasks) {
        var tbody = document.getElementById('taskTableBody');
        tbody.innerHTML = '';

        if (tasks.length === 0) {
          tbody.innerHTML = '<tr><td colspan="3">No tasks found.</td></tr>';
          return;
        }

        for (var i = 0; i < tasks.length; i++) {
          var row = '<tr>';
          row += '<td>' + tasks[i].id + '</td>';
          row += '<td>' + tasks[i].title + '</td>';
          row += '<td>' + tasks[i].status + '</td>';
          row += '</tr>';
          tbody.innerHTML += row;
        }
      })
      .catch(function(error) {
        document.getElementById('message').textContent = 'Error loading tasks.';
      });
  </script>

</body>
</html>

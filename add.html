<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add Task</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background-color: #f2f2f2;
    }

    h1 { color: #333; }

    nav { margin-bottom: 30px; }

    nav a {
      margin-right: 15px;
      text-decoration: none;
      color: #0066cc;
      font-size: 16px;
    }

    nav a:hover { text-decoration: underline; }

    .form-box {
      background-color: white;
      padding: 20px;
      border-radius: 8px;
      max-width: 400px;
    }

    label {
      display: block;
      margin-top: 10px;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input[type="text"], select {
      width: 100%;
      padding: 8px;
      font-size: 14px;
      box-sizing: border-box;
    }

    button {
      margin-top: 15px;
      padding: 10px 20px;
      background-color: #0066cc;
      color: white;
      border: none;
      font-size: 14px;
      cursor: pointer;
      border-radius: 4px;
    }

    button:hover { background-color: #0055aa; }

    #errorMsg { color: red; margin-top: 10px; font-size: 14px; }

    /* Modal */
    #modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-color: rgba(0,0,0,0.5);
    }

    #modalBox {
      background-color: white;
      margin: 150px auto;
      padding: 30px;
      width: 300px;
      border-radius: 8px;
      text-align: center;
    }

    #modalBox button { margin-top: 15px; }
  </style>
</head>
<body>

  <h1>Add Task</h1>

  <nav>
    <a href="index.html">Home</a>
    <a href="view.html">View Tasks</a>
    <a href="add.html">Add Task</a>
    <a href="edit.html">Edit Task</a>
  </nav>

  <div class="form-box">
    <label for="title">Task Title:</label>
    <input type="text" id="title" placeholder="Enter task title">

    <label for="status">Status:</label>
    <select id="status">
      <option value="pending">Pending</option>
      <option value="in-progress">In Progress</option>
      <option value="completed">Completed</option>
    </select>

    <button onclick="addTask()">Add Task</button>
    <p id="errorMsg"></p>
  </div>

  <!-- Modal -->
  <div id="modal">
    <div id="modalBox">
      <p style="font-size: 18px; font-weight: bold;">Record has been saved.</p>
      <button onclick="closeModal()">OK</button>
    </div>
  </div>

  <script>
    function sendNotification(title, message) {
      if ('Notification' in window && Notification.permission === 'granted') {
        new Notification(title, {
          body: message,
          icon: 'https://cdn-icons-png.flaticon.com/512/190/190411.png'
        });
      }
    }

    function addTask() {
      var title = document.getElementById('title').value;
      var status = document.getElementById('status').value;

      if (title === '') {
        document.getElementById('errorMsg').textContent = 'Please enter a title.';
        return;
      }

      document.getElementById('errorMsg').textContent = '';

      fetch('https://my-express-app-rj65.onrender.com/api/v1/tasks', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: title, status: status })
      })
      .then(function(response) { return response.json(); })
      .then(function(data) {
        document.getElementById('title').value = '';
        document.getElementById('status').value = 'pending';
        document.getElementById('modal').style.display = 'block';
        sendNotification('Task Added', 'New task "' + data.title + '" has been added.');
      })
      .catch(function(error) {
        document.getElementById('errorMsg').textContent = 'Error adding task.';
      });
    }

    function closeModal() {
      document.getElementById('modal').style.display = 'none';
    }
  </script>

</body>
</html>

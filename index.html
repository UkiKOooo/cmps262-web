<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Task Manager</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background-color: #f2f2f2;
    }

    h1 {
      color: #333;
    }

    nav {
      margin-bottom: 30px;
    }

    nav a {
      margin-right: 15px;
      text-decoration: none;
      color: #0066cc;
      font-size: 16px;
    }

    nav a:hover {
      text-decoration: underline;
    }

    .box {
      background-color: white;
      padding: 20px;
      border-radius: 8px;
      max-width: 500px;
    }

    p {
      font-size: 16px;
      color: #555;
    }

    #permissionBtn {
      margin-top: 15px;
      padding: 10px 20px;
      background-color: #0066cc;
      color: white;
      border: none;
      font-size: 14px;
      cursor: pointer;
      border-radius: 4px;
    }

    #permissionBtn:hover {
      background-color: #0055aa;
    }

    #permissionStatus {
      margin-top: 10px;
      font-size: 14px;
      color: green;
    }
  </style>
</head>
<body>

  <h1>Task Manager</h1>

  <nav>
    <a href="index.html">Home</a>
    <a href="view.html">View Tasks</a>
    <a href="add.html">Add Task</a>
    <a href="edit.html">Edit Task</a>
  </nav>

  <div class="box">
    <p>Welcome! Use the links above to manage your tasks.</p>
    <p>You can view all tasks, add a new task, edit or delete an existing one.</p>
    <p>Enable notifications to get alerts when tasks are added or updated.</p>
    <button id="permissionBtn" onclick="requestPermission()">Enable Notifications</button>
    <p id="permissionStatus"></p>
  </div>

  <script>
    // Check current permission status on load
    window.onload = function() {
      if (!('Notification' in window)) {
        document.getElementById('permissionStatus').textContent = 'Your browser does not support notifications.';
        document.getElementById('permissionBtn').disabled = true;
      } else if (Notification.permission === 'granted') {
        document.getElementById('permissionStatus').textContent = 'Notifications are enabled!';
        document.getElementById('permissionBtn').disabled = true;
      } else if (Notification.permission === 'denied') {
        document.getElementById('permissionStatus').textContent = 'Notifications are blocked. Please update your browser settings.';
        document.getElementById('permissionBtn').disabled = true;
      }
    };

    function requestPermission() {
      Notification.requestPermission().then(function(permission) {
        if (permission === 'granted') {
          document.getElementById('permissionStatus').textContent = 'Notifications are enabled!';
          document.getElementById('permissionBtn').disabled = true;
          new Notification('Task Manager', {
            body: 'Notifications are now enabled!',
            icon: 'https://cdn-icons-png.flaticon.com/512/190/190411.png'
          });
        } else {
          document.getElementById('permissionStatus').textContent = 'Permission denied.';
        }
      });
    }
  </script>

</body>
</html>
